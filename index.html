<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="suakitsu 的个人博客，正在准备中。">
  <title>suakitsu · 个人博客</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #252923; background: #f7f7f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 24px; }
    main { width: 100%; max-width: 620px; }
    .name { margin: 0 0 48px; font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
    h1 { margin: 0 0 24px; font-size: clamp(36px, 8vw, 56px); font-weight: 500; letter-spacing: -.04em; line-height: 1.3; }
    .intro { margin: 0; color: #62695c; font-size: 17px; line-height: 1.9; }
    footer { margin-top: 56px; padding-top: 24px; border-top: 1px solid #d8ddcf; }
    a { color: #394c35; text-underline-offset: 5px; }
    a:focus-visible { outline: 2px solid #394c35; outline-offset: 6px; }
  </style>
</head>
<body>
  <main>
    <p class="name">suakitsu</p>
    <h1>博客筹备中。</h1>
    <p class="intro">这里将记录我的想法、项目与日常。<br>第一篇文章，敬请期待。</p>
    <footer><a href="https://github.com/suakitsu">在 GitHub 找到我 ↗</a></footer>
  </main>
</body>
</html>
